<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t"><title id="t">Animated: student on a phone as a new, lower interest rate tag appears</title><style>
*{transform-box:view-box}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes wave{0%,100%{transform:scaleX(1) skewY(0deg)}25%{transform:scaleX(.82) skewY(4deg)}50%{transform:scaleX(1) skewY(-2deg)}75%{transform:scaleX(.9) skewY(3deg)}}
@keyframes march{to{stroke-dashoffset:-72}}
@keyframes twinkle{0%,100%{transform:scale(0);opacity:0}20%{transform:scale(1);opacity:1}40%{transform:scale(0);opacity:0}}
@keyframes pulse{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.18)}90%{transform:scale(.96)}}
@keyframes spin{0%,40%,100%{transform:scaleX(1)}55%{transform:scaleX(.08)}70%{transform:scaleX(1)}}
@keyframes sweep{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}}
@keyframes needle{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
@keyframes swing{0%,100%{transform:rotate(0)}30%{transform:rotate(2.5deg)}70%{transform:rotate(-2.5deg)}}
@keyframes flip{0%{transform:scaleX(1);opacity:0}10%,40%{transform:scaleX(1);opacity:1}65%,88%{transform:scaleX(-1);opacity:1}100%{transform:scaleX(-1);opacity:0}}
@keyframes jump{0%,50%,100%{transform:translateY(0)}20%{transform:translateY(-30px)}35%{transform:translateY(-6px)}}
@keyframes fall{0%{transform:translateY(-60px) rotate(0deg);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(150px) rotate(320deg);opacity:0}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-10px)}}
.sway{animation:sway 3s ease-in-out infinite}
.bob{animation:bob 3s ease-in-out infinite}
.wave{animation:wave 2s ease-in-out infinite}
.march{animation:march 1.5s linear infinite}
.twinkle{animation:twinkle 2s ease-in-out infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
.spin{animation:spin 3s ease-in-out infinite}
.sweep{animation:sweep 3s ease-in-out infinite}
.needle{animation:needle 3s ease-in-out infinite}
.swing{animation:swing 3s ease-in-out infinite}
.flip{animation:flip 2s ease-in-out infinite}
.jump{animation:jump 1.5s cubic-bezier(.3,0,.3,1) infinite}
.fall{animation:fall 3s linear infinite}
.bounce{animation:bounce 2s ease-in-out infinite}

@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:0}12%{opacity:1}70%{transform:translate(130px,-115px) scale(1);opacity:1}82%,100%{transform:translate(150px,-132px) scale(1);opacity:0}}
@keyframes tick{to{transform:rotate(360deg)}}
@keyframes grow{0%,15%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes drop{0%{transform:translateY(0);opacity:0}10%{opacity:1}45%{transform:translateY(78px);opacity:1}52%,100%{transform:translateY(84px);opacity:0}}
@keyframes thump{0%,45%,70%,100%{transform:translateY(0) scale(1)}52%{transform:translateY(4px) scale(1.03,.96)}60%{transform:translateY(-6px) scale(1)}}
@keyframes draw{0%{stroke-dashoffset:220;opacity:1}40%,85%{stroke-dashoffset:0;opacity:1}95%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes write{0%{transform:translate(-110px,0)}40%,100%{transform:translate(0,0)}}
.fly{animation:fly 3s ease-in-out infinite}
.tick{animation:tick 6s linear infinite}
.tickh{animation:tick 6s linear infinite;animation-duration:6s}
.grow{animation:grow 3s ease-out infinite}
.drop{animation:drop 2s cubic-bezier(.5,0,.8,.6) infinite}
.thump{animation:thump 2s ease-out infinite}
.draw{animation:draw 3s ease-in-out infinite}

@keyframes rain{0%{transform:translateY(-40px);opacity:0}15%{opacity:.9}80%{opacity:.9}100%{transform:translateY(90px);opacity:0}}
@keyframes rise{0%{transform:translateY(20px);opacity:0}25%,80%{transform:translateY(0);opacity:1}100%{transform:translateY(-6px);opacity:0}}
.rain{animation:rain 1.5s linear infinite}
.rise{animation:rise 3s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
